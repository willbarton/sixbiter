[package]
name = "sixbiter"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/willbarton/sixbiter"
homepage = "https://sixbiter.com"
authors = ["Will Barton <10562538+willbarton@users.noreply.github.com>"]

[[bin]]
name = "sixbiter"
path = "src/main.rs"

[dependencies]
exiftool-rs = "0.7"
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
dirs = "5"
walkdir = "2"
futures = "0.3"
anyhow = "1.0.100"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# GPUI, GPUI Base, GPUI Component and the default icon assets all arrive
# through the single `gpui-kit` facade, which pins the matching `gpui-pre-*`
# snapshot of GPUI itself. Nothing here comes from git any more.
#
# To bump: move this version (and the dev-dependency below to match), then
# `cargo update -p gpui-kit`. Pin exactly -- gpui-kit and the GPUI snapshots
# it tracks are both pre-1.0.
gpui-kit = "=0.6.1"

[dev-dependencies]
tempfile = "3"

# test-support fans out to GPUI, gpui_platform, GPUI Base and GPUI Component.
gpui-kit = { version = "=0.6.1", features = ["test-support"] }
